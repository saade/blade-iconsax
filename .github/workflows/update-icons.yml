name: Update icons

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the latest Iconsax
        run: |
          npm ci --ignore-scripts
          npm install --save-dev --save-exact --ignore-scripts iconsax@latest

      - name: Sync icons
        run: npm run --silent sync > "$RUNNER_TEMP/sync.md"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Execute tests
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          vendor/bin/phpunit

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-icons
          add-paths: |
            resources/svg
            package.json
            package-lock.json
          commit-message: 'feat: sync icons with iconsax'
          title: Sync icons with Iconsax
          body-path: ${{ runner.temp }}/sync.md
